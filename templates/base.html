<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CogArena{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/site.css">
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="border-b border-gray-200 sticky top-0 z-50 bg-white">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="text-xl font-bold tracking-tight text-black">CogArena</a>
                <div class="flex items-center gap-6 text-sm font-medium">
                    <a href="/catalog" class="text-gray-500 hover:text-black transition-colors">Tasks</a>
                    <a href="/leaderboard" class="text-gray-500 hover:text-black transition-colors">Leaderboard</a>
                    <a href="/try" class="text-gray-500 hover:text-black transition-colors">Try It</a>
                    <a href="/docs" class="text-gray-500 hover:text-black transition-colors">API Docs</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 mt-16">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray-400">
                <div>CogArena v0.1.0</div>
                <div class="flex gap-4">
                    <a href="/docs" class="hover:text-black transition-colors">API</a>
                    <span>&middot;</span>
                    <span>NeurIPS 2026 Datasets &amp; Benchmarks</span>
                </div>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
