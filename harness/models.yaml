# CogArena reference model registry.
#
# Each entry maps a short `id` (used in CLI/suite YAML) to an `api` string
# that is passed straight through to the chosen scaffold.
#
# For Browser-Use, the `api` field uses the provider's canonical model ID.
# - Any string containing "/" is routed through OpenRouter and the literal
#   model id is passed to the OpenRouter API (requires OPENROUTER_API_KEY).
#   Use the OpenRouter naming as-is, e.g. "google/gemini-2.5-flash" — do NOT
#   prepend "openrouter/", that would be passed verbatim and OpenRouter would
#   reject it with 400 "is not a valid model ID".
# - Strings without "/" hit the native provider SDK (OpenAI / Anthropic /
#   Google) and require the matching provider API key in env.
#
# Add a new model by appending a new entry. The id must be unique.

models:
  - id: random
    api: random
    scaffold: random
    notes: "Chance-floor baseline. No model API call. Used for L3 chance-floor characterization."

  - id: gemini-2.5-flash
    api: google/gemini-2.5-flash
    scaffold: browser-use
    notes: "Cheap, fast smoke-test model; reliable on slider + keypress tasks."

  - id: gemini-3-pro
    api: google/gemini-3-pro-preview
    scaffold: browser-use
    notes: "Frontier Google multimodal."

  - id: claude-opus-4.7
    api: anthropic/claude-opus-4.7
    scaffold: browser-use
    notes: "Frontier Anthropic. Higher latency (~10s/step)."

  - id: claude-sonnet-4.6
    api: anthropic/claude-sonnet-4.6
    scaffold: browser-use
    notes: "Mid-tier Anthropic. Note keypress-task quirk in CLAUDE.md."

  - id: gpt-5
    api: openai/gpt-5
    scaffold: browser-use
    notes: "Frontier OpenAI."

  - id: kimi-k2.5
    api: moonshotai/kimi-k2.5
    scaffold: browser-use
    notes: "Open-weight option."
