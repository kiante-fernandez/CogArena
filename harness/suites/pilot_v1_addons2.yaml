# Phase-1d: cheap-end / smaller-model expansion of the pilot.
#
# Three more paper-faithful models, all smoke-tested before launch:
#   - qwen3-vl-30b-instruct  ($0.13/M in, $0.52/M out) — GameWorld
#                             reproducibility-study open-source model.
#   - ui-tars-1.5-7b          ($0.10/M in, $0.20/M out) — GameWorld specialty
#                             UI-navigation model.
#   - gpt-5.4-nano            ($0.20/M in, $1.25/M out) — cheapest OpenAI
#                             we can afford; below the paper's GPT-5.2 tier.
#
# 10 tasks x 3 models x 1 repeat = 30 sessions. Estimated total ~$5-7.
# All three smoke-tested on grid_bandit (300s timeout) with valid agent
# actions and no schema rejections.

suite_name: pilot_v1_addons2
default_scaffold: browser-use

tasks:
  - random_dot_motion_v2
  - grid_bandit
  - marbles_risk
  - repeated_games
  - serial_recall_v2
  - visual_recognition
  - effort_foraging
  - tiny_alchemy
  - moral_machine
  - phishing_detection_v2

models:
  - id: qwen3-vl-30b-instruct
  - id: ui-tars-1.5-7b
  - id: gpt-5.4-nano

repeats: 1
n_trials_override: null
task_timeout_seconds: 1800
no_deadline: true
