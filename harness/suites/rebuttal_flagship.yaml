# Flagship arm for the NeurIPS rebuttal — igZ7 W9.
#
# W9: "The 'frontier multimodal agents' label describes a panel made up mostly of
# economy tiers (-flash/-fast/-nano) with no flagship model ... a low L3 cannot be
# attributed to a ceiling of current multimodal cognition rather than to a small,
# inexpensive panel."
#
# gpt-5.2 is the flagship. Chosen over claude-opus-5 because OpenAI models have not
# shown the action-shape quirk documented in CLAUDE.md, and a smoke test on two
# response modalities confirmed it: rc=0 on both, L1=1.00 on repeated_games, 55 and
# 30 trials archived, with only transient AgentOutput retries rather than the
# first-gate validator death that produced zero scorecards for glm-4.6v and
# ui-tars-1.5-7b.
#
# Deliberately 2 repeats, not 10: a scouting arm to see whether the flagship
# behaves differently at all before committing the rest of the budget. Extend by
# re-running with --repeats if the first look justifies it.
#
# Bonus comparison this arm enables: gpt-5.4-nano is already in the main panel, so
# nano vs 5.2 is a within-family contrast across a ~9x price gap. If L3 does not
# improve across that gap, the signature shortfall is not an artifact of testing
# cheap models — which answers W9 with an analysis rather than one more expensive
# row in the table.
#
# 1 model x 10 tasks x 2 repeats = 20 runs, ~$44-62.

suite_name: rebuttal_flagship
default_scaffold: browser-use

tasks:
  - random_dot_motion_v2
  - grid_bandit
  - marbles_risk
  - repeated_games
  - serial_recall_v2
  - visual_recognition
  - effort_foraging
  - tiny_alchemy
  - moral_machine
  - phishing_detection_v2

models:
  - id: gpt-5.2

repeats: 2
n_trials_override: null
task_timeout_seconds: 1800
no_deadline: true
