# Flagship arm for the NeurIPS rebuttal — igZ7 W9.
#
# W9: "The 'frontier multimodal agents' label describes a panel made up mostly of
# economy tiers (-flash/-fast/-nano) with no flagship model ... a low L3 cannot be
# attributed to a ceiling of current multimodal cognition rather than to a small,
# inexpensive panel."
#
# Two models, because W9 has two halves and one model cannot answer both.
#
#   gpt-5.4      Full-size sibling of gpt-5.4-nano, which is ALREADY in the panel.
#                Same generation, ~13x the input price ($2.50 vs $0.20/M). This is
#                the clean test of whether the signature shortfall is an artifact
#                of testing cheap models: no generational confound, only scale.
#
#   gpt-5.6-sol  Newest OpenAI generation, top tier. Answers the literal complaint
#                that the panel contains no flagship.
#
# An earlier draft of this suite used gpt-5.2, which was simply wrong: it is a
# mid-tier model from an OLDER generation than the gpt-5.4-nano already in the
# panel, so it could support neither half of the argument.
#
# OpenAI models avoid the action-shape quirk documented in CLAUDE.md. Verified:
# gpt-5.2 smoke-tested rc=0 on two response modalities with L1=1.00 on
# repeated_games, and both models here accept image input and return clean JSON.
#
# Deliberately 2 repeats, not 10: a scouting arm to see whether the flagship
# behaves differently at all before committing the rest of the budget. Extend by
# re-running with --repeats if the first look justifies it.
#
# The nano-vs-full contrast is the point: gpt-5.4-nano sits in the main panel at
# n=10. If L3 does not improve across a 13x price gap within one generation, the
# signature shortfall is not an artifact of testing cheap models — which answers
# W9 with an analysis rather than one more expensive row in the table.
#
# 1 model x 10 tasks x 1 repeat = 10 runs, ~$55.
#
# Scoped down after a two-task scouting run. gpt-5.6-sol scored L3 0.636 on
# effort_foraging and 1.000 on visual_recognition, beating the BEST single run of
# any panel model across 38 runs each (0.500 and 0.562). The open question is no
# longer whether a top tier differs -- it is whether that holds across all ten
# tasks or only the two weakest, which were deliberately chosen and so invite
# regression to the mean. One pass over the full task set answers that; gpt-5.4
# is held back until the breadth is known.

suite_name: rebuttal_flagship
default_scaffold: browser-use

tasks:
  - random_dot_motion_v2
  - grid_bandit
  - marbles_risk
  - repeated_games
  - serial_recall_v2
  - visual_recognition
  - effort_foraging
  - tiny_alchemy
  - moral_machine
  - phishing_detection_v2

models:
  - id: gpt-5.6-sol    # newest generation, top tier

repeats: 1
n_trials_override: null
task_timeout_seconds: 1800
no_deadline: true
