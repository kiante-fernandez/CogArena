<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Heuristics & Biases</title>
    <script src="/jsPsych-8.2.3/packages/jspsych/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-html-keyboard-response/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-instructions/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-call-function/dist/index.browser.js"></script>
    <link rel="stylesheet" href="/jsPsych-8.2.3/packages/jspsych/css/jspsych.css">
    <style>
        .cue-container { display: flex; justify-content: center; gap: 60px; }
        .competitor-box { font-size: 22px; padding: 25px; border: 3px solid #333; border-radius: 15px; min-width: 250px; text-align: left; line-height: 1.8; background-color: #f9f9f9; }
        .competitor-label { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 10px; }
        .cue-value { font-weight: bold; }
        .cue-positive { color: #2e7d32; }
        .cue-negative { color: #c62828; }
        .key-hint { font-size: 24px; color: #666; margin-top: 10px; text-align: center; }
        .feedback-correct { color: #2e7d32; font-size: 36px; font-weight: bold; }
        .feedback-incorrect { color: #c62828; font-size: 36px; font-weight: bold; }
        .trial-counter { font-size: 20px; color: #888; margin-bottom: 15px; }
        .fixation { font-size: 48px; }
        .block-label { font-size: 16px; color: #1565c0; margin-bottom: 5px; }
    </style>
</head>

    <script src="/static/js/timing.js"></script>
    <script src="experiment.js"></script>

</html>
