<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Insider Attack Game</title>
    <script src="/jsPsych-8.2.3/packages/jspsych/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-html-keyboard-response/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-instructions/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-call-function/dist/index.browser.js"></script>
    <link rel="stylesheet" href="/jsPsych-8.2.3/packages/jspsych/css/jspsych.css">
    <style>
        .target-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 500px; margin: 0 auto; }
        .target-box { font-size: 18px; padding: 15px 20px; border: 2px solid #333; border-radius: 10px; min-width: 120px; text-align: center; background: #e8eaf6; cursor: default; }
        .target-box .reward { color: #2e7d32; font-weight: bold; }
        .target-box .penalty { color: #c62828; font-weight: bold; }
        .warning-box { font-size: 24px; color: #c62828; font-weight: bold; margin: 15px; padding: 15px; border: 3px solid #c62828; border-radius: 10px; background: #ffebee; }
        .key-hint { font-size: 22px; color: #666; margin-top: 10px; }
        .response-options { display: flex; justify-content: center; gap: 60px; margin-top: 15px; }
        .response-box { font-size: 22px; padding: 12px 28px; border: 2px solid #999; border-radius: 10px; }
        .feedback-correct { color: #2e7d32; font-size: 36px; font-weight: bold; }
        .feedback-incorrect { color: #c62828; font-size: 36px; font-weight: bold; }
        .trial-counter { font-size: 20px; color: #888; margin-bottom: 10px; }
        .score-display { font-size: 20px; color: #333; margin: 10px; }
        .fixation { font-size: 48px; }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
