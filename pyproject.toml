[project]
name = "cogarena"
version = "1.2.0"
description = "A benchmark for testing AI agents on interactive behavioral experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "sqlalchemy-libsql>=0.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `pip install -e .[agents]` for the LLM-driven Browser-Use scaffold.
# Pinned version: Browser-Use's API churns aggressively across minor releases;
# we test against 0.9.5. Loosen with care.
agents = [
    "browser-use==0.9.5",
    "playwright>=1.45.0",
]

[project.scripts]
app = "harness.server:app"
cogarena = "harness.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scoring/tests", "harness/tests"]
