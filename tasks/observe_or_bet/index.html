<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Observe or Bet</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .bulb-display { font-size: 72px; margin: 20px; }
        .action-container { display: flex; justify-content: center; gap: 50px; margin-top: 20px; }
        .action-box { font-size: 24px; padding: 20px 30px; border: 3px solid #333; border-radius: 15px; min-width: 140px; text-align: center; background-color: #f5f5f5; }
        .key-hint { font-size: 20px; color: #666; margin-top: 8px; }
        .feedback-correct { color: #2e7d32; font-size: 32px; font-weight: bold; }
        .feedback-incorrect { color: #c62828; font-size: 32px; font-weight: bold; }
        .feedback-observe { color: #1565c0; font-size: 32px; font-weight: bold; }
        .trial-counter { font-size: 20px; color: #888; margin-bottom: 15px; }
        .fixation { font-size: 48px; }
        .score-display { font-size: 18px; color: #555; margin-top: 15px; }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
