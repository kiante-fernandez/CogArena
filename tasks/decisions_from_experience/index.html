<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Decisions from Experience</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .deck-container {
            display: flex;
            justify-content: center;
            gap: 100px;
            align-items: stretch;
            margin: 30px 0;
        }
        .deck-box {
            width: 180px;
            height: 220px;
            border: 4px solid #333;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .deck-box.left { background-color: #e3f2fd; }
        .deck-box.right { background-color: #fce4ec; }
        .deck-box.selected { border-color: #1565c0; border-width: 5px; }
        .deck-label {
            font-size: 16px;
            font-weight: bold;
            color: #666;
            margin-bottom: 8px;
        }
        .deck-key {
            font-size: 22px;
            color: #888;
            margin-top: 12px;
        }
        .sample-outcome {
            font-size: 48px;
            font-weight: bold;
        }
        .sample-outcome.positive { color: #2e7d32; }
        .sample-outcome.negative { color: #c62828; }
        .sample-outcome.zero { color: #555; }
        .sample-counter {
            font-size: 18px;
            color: #888;
            margin-bottom: 10px;
        }
        .phase-label {
            font-size: 22px;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 15px;
        }
        .choice-prompt {
            font-size: 24px;
            margin-top: 20px;
            color: #333;
        }
        .trial-counter {
            font-size: 20px;
            color: #888;
            margin-bottom: 10px;
        }
        .fixation { font-size: 48px; }
        .instruction-hint {
            font-size: 18px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
