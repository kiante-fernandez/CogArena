<!DOCTYPE html>
<html>
<head>
    <title>CogArena - Simple and Choice Reaction Time</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        .rt-stimulus {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fixation {
            font-size: 60px;
            color: #333;
        }
        .feedback {
            font-size: 28px;
        }
        .key-mapping {
            font-size: 24px;
            text-align: center;
            line-height: 2;
        }
        .key-mapping kbd {
            background: #eee;
            border: 1px solid #999;
            border-radius: 4px;
            padding: 2px 8px;
            font-family: monospace;
            font-size: 22px;
        }
        .arrow-stimulus {
            font-size: 80px;
            font-weight: bold;
        }
        .circle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
        }
        .circle-label {
            text-align: center;
            font-size: 18px;
            margin-top: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body></body>
<script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
<script src="experiment.js"></script>
</html>
