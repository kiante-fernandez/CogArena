<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Restless Bandit (Drifting Rewards)</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .slot-container {
            display: flex;
            justify-content: center;
            gap: 100px;
            align-items: center;
        }
        .slot-machine {
            text-align: center;
            padding: 30px 40px;
            border: 4px solid #555;
            border-radius: 18px;
            min-width: 160px;
            background: linear-gradient(180deg, #3a3a4a 0%, #2a2a3a 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .slot-machine .slot-label {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .slot-machine .slot-window {
            background: #1a1a2e;
            border: 2px solid #888;
            border-radius: 8px;
            padding: 20px 10px;
            margin: 10px 0;
            font-size: 40px;
            font-weight: bold;
            color: #ffd700;
            min-height: 50px;
        }
        .slot-machine .key-hint {
            font-size: 24px;
            color: #aaa;
            margin-top: 8px;
        }
        .slot-machine.selected {
            border-color: #4fc3f7;
            border-width: 5px;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
        }
        .reward-display {
            font-size: 56px;
            font-weight: bold;
            color: #4caf50;
            text-align: center;
            margin: 20px;
        }
        .reward-display.timeout {
            color: #e65100;
        }
        .game-header {
            font-size: 22px;
            color: #555;
            margin-bottom: 15px;
            text-align: center;
        }
        .score-display {
            font-size: 20px;
            color: #333;
            text-align: center;
            margin-top: 15px;
        }
        .fixation {
            font-size: 48px;
        }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
