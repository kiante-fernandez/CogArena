<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Contingency Judgment</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .observation-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            gap: 20px;
        }
        .cause-display {
            font-size: 28px;
            padding: 15px 30px;
            border-radius: 12px;
            border: 3px solid #555;
            background: #f9f9f9;
            min-width: 350px;
            text-align: center;
        }
        .effect-display {
            font-size: 32px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 12px;
            min-width: 350px;
            text-align: center;
        }
        .effect-present {
            background: #e8f5e9;
            border: 3px solid #4caf50;
            color: #2e7d32;
        }
        .effect-absent {
            background: #ffebee;
            border: 3px solid #f44336;
            color: #c62828;
        }
        .pill-icon {
            display: inline-block;
            font-size: 36px;
            vertical-align: middle;
            margin-right: 8px;
        }
        .observation-counter {
            font-size: 18px;
            color: #888;
            margin-bottom: 10px;
        }
        .block-label {
            font-size: 16px;
            color: #aaa;
        }
        .rating-prompt {
            font-size: 22px;
            max-width: 600px;
            margin: 0 auto 20px auto;
            line-height: 1.6;
        }
        .rating-summary {
            font-size: 16px;
            color: #666;
            margin-top: 10px;
        }
        .fixation {
            font-size: 60px;
            color: #333;
        }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
