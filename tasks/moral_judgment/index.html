<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Moral Judgment</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .dilemma-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            align-items: stretch;
        }
        .outcome-box {
            font-size: 22px;
            padding: 25px 30px;
            border: 3px solid #333;
            border-radius: 15px;
            min-width: 280px;
            max-width: 340px;
            text-align: left;
            line-height: 1.6;
            background-color: #f9f9f9;
        }
        .outcome-label {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
            text-align: center;
        }
        .action-desc { color: #1565c0; font-weight: bold; }
        .casualties { color: #c62828; margin-top: 10px; }
        .key-hint { font-size: 24px; color: #666; margin-top: 10px; text-align: center; }
        .trial-counter { font-size: 20px; color: #888; margin-bottom: 15px; }
        .fixation { font-size: 48px; }
        .scenario-intro { font-size: 20px; color: #555; margin-bottom: 20px; }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
