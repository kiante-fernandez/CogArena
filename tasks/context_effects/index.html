<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Context Effects</title>
    <script src="/jsPsych-8.2.3/packages/jspsych/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-html-keyboard-response/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-instructions/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-call-function/dist/index.browser.js"></script>
    <link rel="stylesheet" href="/jsPsych-8.2.3/packages/jspsych/css/jspsych.css">
    <style>
        .options-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            align-items: stretch;
        }
        .option-box {
            font-size: 28px;
            padding: 25px 35px;
            border: 3px solid #333;
            border-radius: 15px;
            min-width: 160px;
            text-align: center;
            line-height: 1.6;
            background-color: #f5f5f5;
        }
        .option-label {
            font-size: 16px;
            font-weight: bold;
            color: #666;
            margin-bottom: 8px;
        }
        .option-reward {
            font-size: 36px;
            font-weight: bold;
            color: #1565c0;
        }
        .key-hint { font-size: 24px; color: #666; margin-top: 10px; }
        .trial-counter { font-size: 20px; color: #888; margin-bottom: 15px; }
        .fixation { font-size: 48px; }
        .feedback { font-size: 24px; margin-top: 20px; }
        .feedback-chosen { color: #2e7d32; font-weight: bold; }
        .feedback-other { color: #888; }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
