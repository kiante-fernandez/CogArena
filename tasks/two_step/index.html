<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Two-Step Task</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .stage-container {
            display: flex;
            justify-content: center;
            gap: 80px;
            align-items: center;
            margin: 20px 0;
        }
        .stage-box {
            width: 150px;
            height: 150px;
            border: 4px solid #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            cursor: default;
        }
        /* Stage 1 colors */
        .stage1-left { background-color: #5c6bc0; }
        .stage1-right { background-color: #ec407a; }
        /* Stage 2 state A colors */
        .stage2a-left { background-color: #26a69a; }
        .stage2a-right { background-color: #66bb6a; }
        /* Stage 2 state B colors */
        .stage2b-left { background-color: #ffa726; }
        .stage2b-right { background-color: #ef5350; }
        .stage-box.selected {
            border-color: #ffd740;
            border-width: 6px;
            box-shadow: 0 0 20px rgba(255, 215, 64, 0.6);
        }
        .stage-label {
            font-size: 22px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
            text-align: center;
        }
        .transition-indicator {
            font-size: 18px;
            color: #888;
            text-align: center;
            margin: 10px 0;
        }
        .reward-display {
            font-size: 64px;
            text-align: center;
            margin: 30px 0;
        }
        .reward-coin { color: #ffc107; }
        .reward-none { color: #b71c1c; }
        .key-hint {
            font-size: 20px;
            color: rgba(255,255,255,0.8);
            margin-top: 8px;
        }
        .game-header {
            font-size: 20px;
            color: #555;
            margin-bottom: 10px;
            text-align: center;
        }
        .score-display {
            font-size: 18px;
            color: #444;
            text-align: center;
            margin-top: 15px;
        }
        .fixation {
            font-size: 60px;
            color: #333;
        }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
