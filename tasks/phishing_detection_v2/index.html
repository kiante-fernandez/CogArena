<!DOCTYPE html>
<html>
<head>
    <title>CogArena - Phishing Detection</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            background: #e8eef3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .jspsych-display-element { color: #222; }

        /* Email-client window */
        .email-window {
            max-width: 720px;
            margin: 8px auto;
            background: #fff;
            border: 1px solid #c0c5cb;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: left;
        }
        .email-toolbar {
            background: #f3f4f6;
            border-bottom: 1px solid #d6dade;
            padding: 6px 12px;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .email-toolbar .icons {
            display: flex; gap: 8px; opacity: 0.6;
        }
        .email-header {
            padding: 14px 18px;
            border-bottom: 1px solid #e5e7eb;
        }
        .email-subject {
            font-size: 18px;
            font-weight: 600;
            color: #111;
            margin: 0 0 8px;
            line-height: 1.3;
        }
        .email-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #4b5563;
        }
        .email-from {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .email-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #4b5563;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .email-from-name {
            font-weight: 600;
            color: #111;
        }
        .email-from-addr {
            color: #6b7280;
            font-size: 12px;
        }
        .email-date {
            color: #6b7280;
            font-size: 12px;
        }
        .email-body {
            padding: 18px 22px;
            font-size: 14px;
            line-height: 1.55;
            color: #1f2937;
            min-height: 160px;
            max-height: 360px;
            overflow-y: auto;
        }
        .email-body a {
            color: #1d4ed8;
            text-decoration: underline;
        }
        .email-body p { margin: 0 0 10px; }
        .email-body img { max-width: 100%; height: auto; }

        /* Response prompt */
        .response-prompt {
            text-align: center;
            font-size: 16px;
            color: #1f2937;
            background: #fff7ed;
            border: 1px solid #f59e0b;
            border-radius: 6px;
            padding: 10px 16px;
            margin: 10px auto 0;
            max-width: 720px;
        }
        .response-prompt kbd {
            background: #fff;
            border: 1px solid #d4d4d8;
            border-bottom-width: 2px;
            border-radius: 4px;
            padding: 1px 8px;
            font-family: monospace;
            font-size: 14px;
        }
        .trial-counter {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 6px;
        }

        /* Feedback */
        .feedback {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            padding: 30px 0;
        }
        .feedback.correct { color: #15803d; }
        .feedback.wrong { color: #b91c1c; }
        .feedback.timed_out { color: #b45309; }
        .feedback small {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: #4b5563;
            margin-top: 6px;
        }
        .fixation { font-size: 50px; color: #4b5563; text-align: center; }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
    <script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
