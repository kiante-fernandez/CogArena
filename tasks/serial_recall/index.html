<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Serial Recall</title>
    <script src="/jsPsych-8.2.3/packages/jspsych/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-html-keyboard-response/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-instructions/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-call-function/dist/index.browser.js"></script>
    <script src="/jsPsych-8.2.3/packages/plugin-html-button-response/dist/index.browser.js"></script>
    <link rel="stylesheet" href="/jsPsych-8.2.3/packages/jspsych/css/jspsych.css">
    <style>
        .word-display {
            font-size: 64px;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
            color: #222;
            letter-spacing: 4px;
        }
        .fixation {
            font-size: 48px;
            color: #333;
        }
        .recall-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 700px;
            margin: 20px auto;
        }
        .recall-btn {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            min-width: 110px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .recall-btn:hover {
            background: #e3f2fd;
            border-color: #1976d2;
        }
        .recall-btn.selected {
            background: #bbb;
            color: #666;
            border-color: #999;
            cursor: default;
            opacity: 0.5;
        }
        .recall-order {
            font-size: 16px;
            color: #666;
            margin-top: 16px;
            min-height: 24px;
        }
        .recall-prompt {
            font-size: 22px;
            margin-bottom: 12px;
        }
        .list-counter {
            font-size: 16px;
            color: #888;
            margin-bottom: 8px;
        }
        .done-btn {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 40px;
            margin-top: 20px;
            border: 2px solid #d32f2f;
            border-radius: 8px;
            background: #ffebee;
            color: #d32f2f;
            cursor: pointer;
        }
        .done-btn:hover {
            background: #ffcdd2;
        }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
