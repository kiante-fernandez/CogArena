<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Ultimatum Game</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .ultimatum-info {
            font-size: 20px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }
        .role-label {
            font-size: 16px;
            color: #666;
            font-style: italic;
        }
        .round-header {
            font-size: 20px;
            color: #888;
            margin-bottom: 15px;
        }
        .offer-amount {
            font-size: 48px;
            font-weight: bold;
            color: #2563eb;
        }
        .endowment-display {
            font-size: 24px;
            margin: 10px 0;
        }
        .response-keys {
            font-size: 22px;
            margin-top: 20px;
        }
        .response-keys kbd {
            padding: 4px 12px;
            border: 2px solid #333;
            border-radius: 5px;
            background: #f0f0f0;
            font-size: 22px;
            font-weight: bold;
        }
        .accept-key { color: #2e7d32; }
        .reject-key { color: #c62828; }
        .feedback-container {
            font-size: 22px;
            line-height: 2;
        }
        .feedback-accept { color: #2e7d32; font-weight: bold; }
        .feedback-reject { color: #c62828; font-weight: bold; }
        .feedback-payoff { font-size: 24px; margin-top: 10px; }
        .slider-label {
            font-size: 18px;
            margin-top: 10px;
        }
        .fixation { font-size: 48px; }
        .partner-label {
            font-size: 16px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
