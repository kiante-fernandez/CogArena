<!DOCTYPE html>
<html>
<head>
    <title>CogArena - Probabilistic Classification (Weather Prediction)</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        .wpt-cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }
        .wpt-card {
            width: 100px;
            height: 140px;
            border: 3px solid #555;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .wpt-card-present {
            opacity: 1.0;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
        }
        .wpt-card-absent {
            opacity: 0.15;
            border-style: dashed;
        }
        .wpt-card-1 { background: #f0c040; color: #333; }
        .wpt-card-2 { background: #4a90d9; color: #fff; }
        .wpt-card-3 { background: #d94a4a; color: #fff; }
        .wpt-card-4 { background: #3bb573; color: #fff; }
        .wpt-label {
            font-size: 14px;
            margin-top: 6px;
            text-align: center;
            color: #666;
        }
        .fixation {
            font-size: 60px;
            color: #333;
        }
        .feedback {
            font-size: 36px;
            font-weight: bold;
        }
        .wpt-prompt {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body></body>
<script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
<script src="experiment.js"></script>
</html>
