<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CogArena - Repeated Prisoner's Dilemma</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
        .payoff-matrix {
            border-collapse: collapse;
            margin: 20px auto;
            font-size: 20px;
        }
        .payoff-matrix th, .payoff-matrix td {
            border: 2px solid #333;
            padding: 14px 22px;
            text-align: center;
        }
        .payoff-matrix th {
            background-color: #e0e0e0;
            font-weight: bold;
        }
        .payoff-matrix td {
            background-color: #fafafa;
        }
        .payoff-matrix .header-row th {
            background-color: #bdbdbd;
        }
        .payoff-matrix .you-label {
            background-color: #1565c0;
            color: #fff;
            font-weight: bold;
        }
        .payoff-matrix .partner-label {
            background-color: #7b1fa2;
            color: #fff;
            font-weight: bold;
        }
        .payoff-cell {
            font-size: 22px;
            line-height: 1.5;
        }
        .payoff-you { color: #1565c0; font-weight: bold; }
        .payoff-partner { color: #7b1fa2; }
        .round-header {
            font-size: 22px;
            color: #555;
            margin-bottom: 10px;
        }
        .cumulative-score {
            font-size: 20px;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .key-hint {
            font-size: 26px;
            margin-top: 20px;
            color: #333;
        }
        .key-hint kbd {
            display: inline-block;
            padding: 4px 14px;
            border: 2px solid #555;
            border-radius: 6px;
            background-color: #f5f5f5;
            font-family: monospace;
            font-size: 24px;
        }
        .feedback-container {
            font-size: 26px;
            line-height: 1.8;
        }
        .feedback-choice { margin: 8px 0; }
        .feedback-choice.cooperate { color: #2e7d32; }
        .feedback-choice.defect { color: #c62828; }
        .feedback-payoff {
            font-size: 28px;
            font-weight: bold;
            margin-top: 12px;
        }
        .feedback-cumulative {
            font-size: 22px;
            color: #555;
            margin-top: 8px;
        }
        .fixation { font-size: 48px; }
        .trial-counter { font-size: 20px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <script src="/static/js/timing.js"></script>
<script src="/static/js/incremental_save.js"></script>
    <script src="experiment.js"></script>
</body>
</html>
